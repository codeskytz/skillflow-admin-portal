# Test, build, then upload the static build to cPanel over SSH.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST   server hostname or IP
#   SSH_USER   cPanel username, also used to build /home/<user>/...
#   SSH_KEY    private key, full PEM text; the public half goes in the cPanel
#              account's ~/.ssh/authorized_keys
#   SSH_PORT   optional, defaults to 22
#
#   VITE_API_URL   https://api.skillflowtz.com/api/v1
#                  Required. The dev proxy in vite.config.js does not exist in
#                  a static build, so without this the app would ask
#                  admin.skillflowtz.com for /api/v1 and get its own HTML back.
#
# No Firebase secrets here: Google sign-in is deliberately not enabled on the
# admin portal, which stays password-only.
#
# Optional repository variable:
#   DEPLOY_DIR     overrides the target directory name

name: Test & Deploy Admin Portal

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # A production build that fails to compile is the single most likely way
      # to break this site, so it is part of the gate rather than something
      # discovered during the upload.
      - name: Build
        run: npm run build

  deploy:
    name: Deploy to cPanel
    # The gate: no upload happens unless the job above passed.
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite inlines VITE_* values at build time, so this has to be present
      # here rather than on the server.
      - name: Build for production
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      # Uploading an incomplete build would take the site down: the unpack step
      # clears the document root before writing the new release. Check here,
      # while failing still costs nothing.
      - name: Verify the build looks complete
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/.htaccess || { echo "dist/.htaccess missing - SPA routes would 404"; exit 1; }
          ls dist/assets/*.js >/dev/null 2>&1 || { echo "no JS bundle in dist/assets"; exit 1; }
          if ! grep -rq "${{ secrets.VITE_API_URL }}" dist/assets/*.js; then
            echo "VITE_API_URL is not in the bundle - the app would call the wrong host"
            exit 1
          fi
          echo "Build looks good:"
          du -sh dist

      # This cPanel host has no rsync, so the build travels as one gzipped
      # archive and is unpacked on the server instead.
      - name: Package the build
        run: |
          # -C dist . archives the contents rather than a "dist" folder, and
          # includes dotfiles such as .htaccess.
          tar -czf build.tar.gz -C dist .
          echo "archive size: $(du -h build.tar.gz | cut -f1)"
          echo "contents:"
          tar -tzf build.tar.gz | head -10

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${{ secrets.SSH_PORT }}"
          ssh-keyscan -p "${PORT:-22}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Piped through ssh rather than sent with scp or sftp: this needs nothing
      # on the far end beyond a shell, which matters on a host that already
      # turned out not to have rsync.
      - name: Upload the archive
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || 'admin.skillflowtz.com' }}
        run: |
          PORT="${{ secrets.SSH_PORT }}"
          TARGET="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" "$TARGET" 'mkdir -p ~/.deploy'
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" "$TARGET" \
            "cat > ~/.deploy/$DEPLOY_DIR.tar.gz" < build.tar.gz
          echo "uploaded to ~/.deploy/$DEPLOY_DIR.tar.gz"

      # The script is a committed file rather than an inline heredoc: a heredoc
      # terminator inside a YAML block scalar has to line up with the block's
      # own indentation, and gets silently swallowed when it does not.
      - name: Unpack into the document root
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || 'admin.skillflowtz.com' }}
        run: |
          PORT="${{ secrets.SSH_PORT }}"
          TARGET="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" "$TARGET" \
            "DEPLOY_DIR='$DEPLOY_DIR' bash -s" < .github/deploy/unpack.sh

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
